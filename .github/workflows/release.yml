# Publish to npm and ClaWHub on GitHub release
name: Release

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Update npm (trusted publishing requires >=11.5.1)
        run: npm install -g npm@11.5.1

      - name: Install
        run: npm ci

      - name: Audit
        run: npm audit --audit-level=moderate

      - name: Type Check
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Get version from package.json
        id: pkg
        run: echo "version=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"

      - name: Publish to npm
        run: npm publish --provenance --access public

      - name: Publish to ClaWHub
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
          PKG_VERSION: ${{ steps.pkg.outputs.version }}
        run: npx clawhub login --token "$CLAWHUB_TOKEN" --no-browser && npx clawhub publish skill --slug moltblock --version "$PKG_VERSION" --changelog "Release $PKG_VERSION — see https://github.com/moltblock/moltblock/releases/tag/v$PKG_VERSION"
